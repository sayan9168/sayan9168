<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sayan Mahata — cinematic systems architect profile banner</title>
  <desc id="desc">A fictional, stylized 3D-inspired Indian systems architect avatar in a modern dark tech jacket, centered amid holographic compiler-flow panels, security shields, neural nodes, and blue-cyan volumetric light. It is an illustration, not a photo or likeness.</desc>
