    <linearGradient id="bg" x1="53" y1="0" x2="1127" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#060B16"/><stop offset=".5" stop-color="#0A1426"/><stop offset="1" stop-color="#15152E"/></linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(350 0 0 270 600 288)" gradientUnits="userSpaceOnUse"><stop stop-color="#147FB4" stop-opacity=".34"/><stop offset=".55" stop-color="#3C67C9" stop-opacity=".16"/><stop offset="1" stop-color="#573AC0" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x1="515" y1="148" x2="681" y2="345" gradientUnits="userSpaceOnUse"><stop stop-color="#F5CFAC"/><stop offset=".46" stop-color="#C98F76"/><stop offset="1" stop-color="#875764"/></linearGradient>
    <linearGradient id="hair" x1="507" y1="104" x2="687" y2="206" gradientUnits="userSpaceOnUse"><stop stop-color="#4C5B70"/><stop offset=".34" stop-color="#1B273B"/><stop offset="1" stop-color="#080D18"/></linearGradient>
    <linearGradient id="jacket" x1="389" y1="359" x2="814" y2="558" gradientUnits="userSpaceOnUse"><stop stop-color="#31465F"/><stop offset=".4" stop-color="#17273C"/><stop offset="1" stop-color="#101725"/></linearGradient>
    <linearGradient id="trim" x1="408" y1="367" x2="802" y2="537" gradientUnits="userSpaceOnUse"><stop stop-color="#55ECF4"/><stop offset=".55" stop-color="#348FE0"/><stop offset="1" stop-color="#9A70FF"/></linearGradient>
    <linearGradient id="panel" x1="99" y1="167" x2="303" y2="334" gradientUnits="userSpaceOnUse"><stop stop-color="#13263C" stop-opacity=".93"/><stop offset="1" stop-color="#10162A" stop-opacity=".75"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" stroke="#99BFFF" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="277" y="42" width="646" height="508" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="29"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
