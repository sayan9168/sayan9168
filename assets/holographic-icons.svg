<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Five floating 3D-inspired research and engineering icons</title>
  <desc id="desc">A transparent-background set of neon cyan and blue shield, compiler gear, neural network, code terminal, and lock icons.</desc>
  <defs>
    <linearGradient id="g" x1="50" y1="35" x2="950" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#62F2EC"/><stop offset=".5" stop-color="#50B4FF"/><stop offset="1" stop-color="#C18BFF"/></linearGradient>
    <linearGradient id="face" x1="74" y1="32" x2="152" y2="142" gradientUnits="userSpaceOnUse"><stop stop-color="#19425A"/><stop offset="1" stop-color="#12192F"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-50%" y="-30%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <!-- shield -->
  <g transform="translate(78 18)"><ellipse cx="70" cy="151" rx="43" ry="10" fill="#3B9DCA" opacity=".35" filter="url(#shadow)"/><path d="m70 25 49 18v40c0 39-49 68-49 68S21 122 21 83V43l49-18Z" fill="#48DFFF" opacity=".3" filter="url(#glow)"/><path d="m70 24 49 18v40c0 39-49 68-49 68S21 121 21 82V42l49-18Z" fill="url(#face)" stroke="url(#g)" stroke-width="2.5"/><path d="m70 36 37 14v31c0 29-37 52-37 52S33 110 33 81V50l37-14Z" stroke="#9BF9FF" stroke-opacity=".68"/><path d="m53 81 12 12 25-29" stroke="#D9FFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="183" text-anchor="middle" fill="#BFEFFF" font-family="monospace" font-size="10" letter-spacing="1.4">SECURE</text></g>
  <!-- compiler gear -->
  <g transform="translate(267 18)"><ellipse cx="70" cy="151" rx="43" ry="10" fill="#4B8ECA" opacity=".3" filter="url(#shadow)"/><circle cx="70" cy="83" r="57" fill="#439CF4" opacity=".24" filter="url(#glow)"/><path d="M61 26h18l5 15a45 45 0 0 1 11 5l14-7 13 13-7 14a45 45 0 0 1 5 11l15 5v18l-15 5a45 45 0 0 1-5 11l7 14-13 13-14-7a45 45 0 0 1-11 5l-5 15H61l-5-15a45 45 0 0 1-11-5l-14 7-13-13 7-14a45 45 0 0 1-5-11L5 100V82l15-5a45 45 0 0 1 5-11l-7-14 13-13 14 7a45 45 0 0 1 11-5l5-15Z" transform="translate(14 0) scale(.8 1)" fill="url(#face)" stroke="url(#g)" stroke-width="2.5"/><circle cx="70" cy="83" r="23" fill="#0A1930" stroke="#A3F7FF" stroke-width="2.5"/><circle cx="70" cy="83" r="9" fill="#75EFFF"/><text x="70" y="183" text-anchor="middle" fill="#C2EFFF" font-family="monospace" font-size="10" letter-spacing="1.4">COMPILE</text></g>
  <!-- neural network -->
  <g transform="translate(457 18)"><ellipse cx="70" cy="151" rx="43" ry="10" fill="#5298E1" opacity=".3" filter="url(#shadow)"/><circle cx="70" cy="83" r="56" fill="#7654D8" opacity=".25" filter="url(#glow)"/><g stroke="url(#g)" stroke-width="2.5" stroke-opacity=".8"><path d="m70 83-30-26m30 26 30-26M70 83l-31 31m31-31 31 31m-31-31v43m-30-69 30-13 30 13m-61 69 30 12 31-12"/></g><g fill="#152A47" stroke="#B2F5FF" stroke-width="2"><circle cx="70" cy="83" r="11"/><circle cx="40" cy="57" r="8"/><circle cx="100" cy="57" r="8"/><circle cx="39" cy="114" r="8"/><circle cx="101" cy="114" r="8"/><circle cx="70" cy="126" r="8"/></g><circle cx="70" cy="83" r="4" fill="#9EFCFF"/><text x="70" y="183" text-anchor="middle" fill="#D1D1FF" font-family="monospace" font-size="10" letter-spacing="1.4">CONNECT</text></g>
  <!-- terminal/code -->
  <g transform="translate(647 18)"><ellipse cx="70" cy="151" rx="47" ry="10" fill="#378ABF" opacity=".33" filter="url(#shadow)"/><rect x="16" y="34" width="108" height="100" rx="13" fill="#4AC8F6" opacity=".24" filter="url(#glow)"/><rect x="18" y="32" width="104" height="94" rx="12" fill="url(#face)" stroke="url(#g)" stroke-width="2.5"/><path d="M18 55h104" stroke="#7CEAFF" stroke-opacity=".58"/><circle cx="33" cy="44" r="3" fill="#FF9E84"/><circle cx="44" cy="44" r="3" fill="#FFDA85"/><circle cx="55" cy="44" r="3" fill="#84F6C8"/><path d="m39 76-12 10 12 10m29-20 12 10-12 10m-7-25-12 30" stroke="#9CF6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="183" text-anchor="middle" fill="#BFEFFF" font-family="monospace" font-size="10" letter-spacing="1.4">RESEARCH</text></g>
  <!-- lock -->
  <g transform="translate(837 18)"><ellipse cx="70" cy="151" rx="43" ry="10" fill="#9071D2" opacity=".3" filter="url(#shadow)"/><path d="M45 75V61a25 25 0 0 1 50 0v14" stroke="#B4F8FF" stroke-width="8" stroke-linecap="round"/><rect x="25" y="71" width="90" height="68" rx="14" fill="#AB71EF" opacity=".24" filter="url(#glow)"/><rect x="28" y="73" width="84" height="63" rx="12" fill="url(#face)" stroke="url(#g)" stroke-width="2.5"/><circle cx="70" cy="99" r="8" fill="#C7FCFF"/><path d="M70 106v13" stroke="#C7FCFF" stroke-width="4" stroke-linecap="round"/><text x="70" y="183" text-anchor="middle" fill="#D1C9FF" font-family="monospace" font-size="10" letter-spacing="1.4">PROTECT</text></g>
</svg>
