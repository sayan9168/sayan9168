<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sayan Mahata's systems and security research map</title>
  <desc id="desc">Four connected research domains—language and compilers, systems engineering, security research, and intelligence tools—around a central build-and-learn loop.</desc>
  <defs>
