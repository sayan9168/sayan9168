  <path d="M252 427h9l-6 180h-26l-12-89-16-81 51-10Z" fill="#34445A" fill-opacity=".56"/>
  <path d="m203 453 46 14m31-14-39 14m-25 61h24m21 0h28m-70 55h30m14 0h27" stroke="#7188A0" stroke-opacity=".42" stroke-width="2"/>
