  <!-- one hand slightly raised in greeting -->
  <path d="M101 389c-12-24-13-48-3-68l12-21c5-9 15-6 14 4l-3 18 15-24c6-9 16-5 12 5l-12 31 18-18c7-7 15 0 10 9l-18 32c-10 19-23 33-42 46l-6-14Z" fill="url(#skin)" stroke="#F1C6A7" stroke-width="1.5"/>
