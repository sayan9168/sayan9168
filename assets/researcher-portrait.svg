  <path d="m217 269 38 37 38-37 11 177h-98l11-177Z" fill="#1A2A3F" stroke="#6E8AA7" stroke-width="2"/>
  <path d="m217 285 38 29 38-29m-72 64h67m-69 28h65m-62 28h58" stroke="url(#cyan)" stroke-opacity=".82" stroke-width="2"/>
