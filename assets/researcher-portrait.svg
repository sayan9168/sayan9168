  <ellipse cx="230" cy="192" rx="5.2" ry="7.5" fill="#3B7EAF"/><ellipse cx="278" cy="192" rx="5.2" ry="7.5" fill="#3B7EAF"/><circle cx="231" cy="190" r="2" fill="white"/><circle cx="279" cy="190" r="2" fill="white"/>
  <path d="M210 179c9-6 20-7 30-2m24-2c10-6 21-5 30 2" stroke="#342D36" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M255 199c-2 11-6 20-4 23 3 3 7 3 10 0m-16 24c7 5 18 5 25 0" stroke="#955F5C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- short, neat hair -->
  <path d="M181 179c-8-31 2-64 29-82 23-15 59-15 84 1 27 17 37 47 29 81l-17-24-12 15-13-27-16 19-15-22-16 23-13-16-12 25-15-8-13 15Z" fill="url(#hair)" stroke="#70849B" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="m200 136 15-27 12 24m15-35 13 27 17-24 10 31 16-18 9 25" stroke="#91A5BA" stroke-opacity=".42" stroke-width="1.8" stroke-linecap="round"/>
  <!-- floating holographic system elements -->
  <g font-family="monospace" font-size="7.5"><rect x="34" y="222" width="75" height="34" rx="7" fill="#10233A" stroke="#4BBFD9"/><text x="71" y="237" text-anchor="middle" fill="#89ECF4">compiler</text><path d="M45 245h52m-52 5h33" stroke="#5A8CA8"/><rect x="397" y="257" width="82" height="36" rx="7" fill="#171E3B" stroke="#8E7CE1"/><text x="438" y="272" text-anchor="middle" fill="#C9BBFF">threat map</text><path d="M408 280h60m-60 5h35" stroke="#756CB0"/></g>
  <path d="M109 239h64m159 35h65" stroke="#62DBEA" stroke-dasharray="3 5"/>
  <text x="255" y="662" text-anchor="middle" fill="#BDCDDF" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1">BUILD THOUGHTFULLY · SECURE BY DESIGN</text>
</svg>
