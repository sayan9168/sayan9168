  <path d="M218 244c18 20 52 24 74 5v33c-18 24-56 23-74-2v-36Z" fill="#945B5A" fill-opacity=".48"/>
  <ellipse cx="190" cy="194" rx="15" ry="24" fill="#C98E77"/><ellipse cx="320" cy="194" rx="15" ry="24" fill="#C98E77"/>
