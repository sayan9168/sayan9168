<svg xmlns="http://www.w3.org/2000/svg" width="510" height="680" viewBox="0 0 510 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Full-body stylized 3D researcher avatar</title>
  <desc id="desc">An original fictional Indian male systems researcher in his mid-twenties with short black hair, an understated charcoal tech hoodie with cyan circuit accents, dark trousers, and one hand raised slightly. Full-body concept render, not a photograph or likeness.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="0" x2="492" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#07111F"/><stop offset=".55" stop-color="#0E1930"/><stop offset="1" stop-color="#1A1531"/></linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(0 260 -205 0 255 390)" gradientUnits="userSpaceOnUse"><stop stop-color="#167CAE" stop-opacity=".32"/><stop offset="1" stop-color="#7353C7" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="203" y1="148" x2="307" y2="277" gradientUnits="userSpaceOnUse"><stop stop-color="#F1C9AA"/><stop offset=".55" stop-color="#C78D76"/><stop offset="1" stop-color="#8A5962"/></linearGradient>
    <linearGradient id="hair" x1="194" y1="105" x2="319" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#46546A"/><stop offset=".48" stop-color="#1A2639"/><stop offset="1" stop-color="#080E19"/></linearGradient>
    <linearGradient id="hoodie" x1="128" y1="285" x2="393" y2="469" gradientUnits="userSpaceOnUse"><stop stop-color="#30445D"/><stop offset=".5" stop-color="#17263B"/><stop offset="1" stop-color="#101522"/></linearGradient>
    <linearGradient id="pants" x1="190" y1="428" x2="334" y2="618" gradientUnits="userSpaceOnUse"><stop stop-color="#26354B"/><stop offset="1" stop-color="#111927"/></linearGradient>
    <linearGradient id="cyan" x1="123" y1="300" x2="398" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#69F0F4"/><stop offset=".52" stop-color="#3C9EEA"/><stop offset="1" stop-color="#AE7CFF"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" stroke="#A4C7FF" stroke-opacity=".052"/></pattern>
    <filter id="blur" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="17"/></filter>
  </defs>
  <rect x="1" y="1" width="508" height="678" rx="23" fill="url(#bg)" stroke="#7AB8F4" stroke-opacity=".27" stroke-width="2"/>
  <rect x="2" y="2" width="506" height="676" rx="22" fill="url(#grid)"/><rect x="2" y="2" width="506" height="676" rx="22" fill="url(#aura)"/>
  <text x="255" y="39" text-anchor="middle" fill="#82E8F4" font-family="monospace" font-size="10" letter-spacing="2.4">SYSTEMS  /  SECURITY  /  CURIOSITY</text>
  <path d="M34 88h71l17-17h49m305 36h-55l-17 17h-42" stroke="#61D8EF" stroke-opacity=".34"/><g fill="#9DEEFF"><circle cx="122" cy="71" r="2.4"/><circle cx="405" cy="124" r="2.2"/><circle cx="67" cy="393" r="2"/><circle cx="452" cy="476" r="2"/></g>
  <!-- soft stage lighting and floor shadow -->
  <ellipse cx="255" cy="610" rx="138" ry="22" fill="#4D9DDB" opacity=".32" filter="url(#blur)"/><ellipse cx="255" cy="623" rx="101" ry="14" fill="#050916" opacity=".78"/>
