<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative 3D intelligence graph</title>
  <desc id="desc">A concept visualization of a connected OSINT graph with entity nodes, evidence links, depth layers, and a glowing central analysis hub. This is illustrative, not live data.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="30" x2="950" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#071521"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#181334"/></linearGradient>
    <linearGradient id="wire" x1="176" y1="104" x2="844" y2="319" gradientUnits="userSpaceOnUse"><stop stop-color="#4CF0E2"/><stop offset=".48" stop-color="#55AFFF"/><stop offset="1" stop-color="#D083FF"/></linearGradient>
    <radialGradient id="hub" cx="0" cy="0" r="1" gradientTransform="matrix(0 86 -92 0 514 201)" gradientUnits="userSpaceOnUse"><stop stop-color="#20638A"/><stop offset="1" stop-color="#101B39"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" stroke="#8ED9FF" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="330" y="55" width="370" height="300" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="23"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect x="1" y="1" width="998" height="428" rx="24" fill="url(#bg)" stroke="#65D7FF" stroke-opacity=".23" stroke-width="2"/><rect x="2" y="2" width="996" height="426" rx="23" fill="url(#grid)"/>
  <text x="36" y="42" fill="#65E9E2" font-family="monospace" font-size="11" letter-spacing="3">NEXUS OSINT  /  3D LINK-ANALYSIS CONCEPT</text>
  <!-- perspective data floor -->
  <g stroke="#5FB1E8" stroke-opacity=".13" stroke-width="1"><path d="m90 354 410-170 410 170M130 371l370-153 370 153M190 390l310-128 310 128M240 407l260-108 260 108"/><path d="m190 317 80 90m45-111 53 133m105-155v155m106-133-53 133m189-112-80 90"/></g>
  <!-- dimensional links behind the nodes -->
  <g stroke="url(#wire)" stroke-width="2" stroke-opacity=".75"><path d="m500 190-238-77m238 77 216-82m-216 82 255 78m-255-78-235 104m235-104 22-138m-22 138-20 156m20-156 193 151m-193-151-201-159m201 159 352-59"/><path d="m262 113 15 182m439-187 42 179m-516-58 267 136" stroke-opacity=".33" stroke-dasharray="4 6"/></g>
  <g fill="#94F3FF"><circle cx="378" cy="150" r="3"/><circle cx="600" cy="151" r="3"/><circle cx="625" cy="236" r="3"/><circle cx="386" cy="241" r="3"/><circle cx="511" cy="87" r="3"/><circle cx="480" cy="268" r="3"/></g>
  <!-- floating shadow -->
  <ellipse cx="514" cy="299" rx="154" ry="31" fill="#132244" opacity=".8" filter="url(#shadow)"/>
  <circle cx="514" cy="201" r="105" fill="#248DFF" opacity=".2" filter="url(#glow)"/>
  <!-- central raised hex hub -->
  <path d="m514 106 83 48v95l-83 48-83-48v-95l83-48Z" fill="url(#hub)" stroke="#84EAF6" stroke-width="2"/>
  <path d="m514 124 67 39v77l-67 39-67-39v-77l67-39Z" stroke="#A1EDFF" stroke-opacity=".38"/>
  <circle cx="514" cy="201" r="23" fill="#143451" stroke="#83F0FF" stroke-width="1.5"/><circle cx="514" cy="201" r="8" fill="#9DF9FF"/>
  <text x="514" y="284" text-anchor="middle" fill="#D6F7FF" font-family="monospace" font-size="10" letter-spacing="1.5">ANALYSIS HUB</text>
  <!-- raised entity nodes -->
  <g><ellipse cx="262" cy="127" rx="60" ry="12" fill="#0B2633"/><path d="M202 91h120v36c0 11-27 20-60 20s-60-9-60-20V91Z" fill="#0E2C3B" stroke="#53DFD7"/><ellipse cx="262" cy="91" rx="60" ry="18" fill="#153E4D" stroke="#65F0E2"/><text x="262" y="96" text-anchor="middle" fill="#D8FFFA" font-family="monospace" font-size="11">PERSON</text></g>
  <g><ellipse cx="716" cy="112" rx="61" ry="12" fill="#111B3A"/><path d="M655 76h122v36c0 11-27 20-61 20s-61-9-61-20V76Z" fill="#1A2250" stroke="#79A8FF"/><ellipse cx="716" cy="76" rx="61" ry="18" fill="#25366B" stroke="#84B7FF"/><text x="716" y="81" text-anchor="middle" fill="#E4EFFF" font-family="monospace" font-size="11">DOMAIN</text></g>
  <g><ellipse cx="755" cy="279" rx="62" ry="12" fill="#221633"/><path d="M693 242h124v37c0 11-28 20-62 20s-62-9-62-20v-37Z" fill="#2A1B40" stroke="#C483FF"/><ellipse cx="755" cy="242" rx="62" ry="18" fill="#45255E" stroke="#D39AFF"/><text x="755" y="247" text-anchor="middle" fill="#F5E8FF" font-family="monospace" font-size="11">INFRASTRUCTURE</text></g>
  <g><ellipse cx="265" cy="306" rx="60" ry="12" fill="#251C35"/><path d="M205 270h120v36c0 11-27 20-60 20s-60-9-60-20v-36Z" fill="#34223C" stroke="#F0A66E"/><ellipse cx="265" cy="270" rx="60" ry="18" fill="#573248" stroke="#FFB582"/><text x="265" y="275" text-anchor="middle" fill="#FFF1E7" font-family="monospace" font-size="11">SIGNAL</text></g>
  <g><ellipse cx="511" cy="82" rx="58" ry="11" fill="#10262D"/><path d="M453 49h116v33c0 11-26 19-58 19s-58-8-58-19V49Z" fill="#133640" stroke="#63DBE8"/><ellipse cx="511" cy="49" rx="58" ry="16" fill="#1B4C57" stroke="#8AF3F4"/><text x="511" y="54" text-anchor="middle" fill="#E3FFFF" font-family="monospace" font-size="10">EVENT</text></g>
  <text x="500" y="408" text-anchor="middle" fill="#879AB8" font-family="monospace" font-size="10" letter-spacing="2">ILLUSTRATIVE VISUAL · NOT LIVE OR REAL-WORLD INTELLIGENCE DATA</text>
</svg>
