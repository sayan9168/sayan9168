<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sayanox compiler bootstrap and output pipeline</title>
  <desc id="desc">A visual journey from Sayanox source through seed and self-hosted compiler generations to native x86-64 output, with offline packages and a growing standard library.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="0" x2="1150" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#08121F"/><stop offset="1" stop-color="#15132F"/></linearGradient>
    <linearGradient id="edge" x1="118" y1="110" x2="1080" y2="198" gradientUnits="userSpaceOnUse"><stop stop-color="#5CE8F4"/><stop offset=".48" stop-color="#638CFF"/><stop offset="1" stop-color="#C078FF"/></linearGradient>
    <linearGradient id="tile" x1="130" y1="88" x2="220" y2="204" gradientUnits="userSpaceOnUse"><stop stop-color="#153852"/><stop offset="1" stop-color="#10192D"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" stroke="#A8BFFF" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="0" y="40" width="1200" height="200" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#bg)" stroke="#7C9AFF" stroke-opacity=".23" stroke-width="2"/><rect x="2" y="2" width="1196" height="296" rx="21" fill="url(#grid)"/>
  <text x="38" y="43" fill="#70E8FF" font-family="monospace" font-size="12" letter-spacing="3">SAYANOX  /  THE BOOTSTRAP JOURNEY</text>
  <path d="M155 153H1045" stroke="url(#edge)" stroke-opacity=".28" stroke-width="15" filter="url(#glow)"/><path d="M155 153H1045" stroke="url(#edge)" stroke-width="2" stroke-dasharray="7 8"/>
  <g>
    <path d="m160 82 76 38v75l-76 39-76-39v-75l76-38Z" fill="url(#tile)" stroke="#57DFF4" stroke-width="1.6"/><path d="m160 99 58 29v59l-58 29-58-29v-59l58-29Z" stroke="#70E8FF" stroke-opacity=".35"/>
    <text x="160" y="150" text-anchor="middle" fill="#E9FBFF" font-family="monospace" font-size="18" font-weight="700">.sa</text><text x="160" y="172" text-anchor="middle" fill="#93B7CE" font-family="monospace" font-size="10">SOURCE</text>
    <text x="160" y="260" text-anchor="middle" fill="#C4D6EC" font-family="Arial, sans-serif" font-size="14" font-weight="700">Sayanox code</text>
  </g>
  <g>
    <path d="m455 82 76 38v75l-76 39-76-39v-75l76-38Z" fill="url(#tile)" stroke="#5BBFFF" stroke-width="1.6"/><path d="m455 99 58 29v59l-58 29-58-29v-59l58-29Z" stroke="#68B7FF" stroke-opacity=".4"/>
    <path d="m455 125 23 14v28l-23 14-23-14v-28l23-14Z" stroke="#B7E9FF" stroke-width="1.5"/><text x="455" y="156" text-anchor="middle" fill="#D6F2FF" font-family="monospace" font-size="11">SEED</text>
    <text x="455" y="260" text-anchor="middle" fill="#C4D6EC" font-family="Arial, sans-serif" font-size="14" font-weight="700">Bootstrap</text>
  </g>
  <g>
    <path d="m750 82 76 38v75l-76 39-76-39v-75l76-38Z" fill="url(#tile)" stroke="#858EFF" stroke-width="1.6"/><path d="m750 99 58 29v59l-58 29-58-29v-59l58-29Z" stroke="#969AFF" stroke-opacity=".4"/>
    <path d="m750 124 24 14v30l-24 14-24-14v-30l24-14Z" stroke="#D4D0FF" stroke-width="1.5"/><text x="750" y="156" text-anchor="middle" fill="#ECEAFF" font-family="monospace" font-size="11">GEN 2</text>
    <text x="750" y="260" text-anchor="middle" fill="#D5D0F4" font-family="Arial, sans-serif" font-size="14" font-weight="700">Self-hosting compiler</text>
  </g>
  <g>
    <path d="m1045 82 76 38v75l-76 39-76-39v-75l76-38Z" fill="#1C183B" stroke="#C07AFF" stroke-width="1.6"/><path d="m1045 99 58 29v59l-58 29-58-29v-59l58-29Z" stroke="#D18EFF" stroke-opacity=".4"/>
    <text x="1045" y="148" text-anchor="middle" fill="#F4E9FF" font-family="monospace" font-size="15" font-weight="700">x86-64</text><text x="1045" y="169" text-anchor="middle" fill="#C1A6D7" font-family="monospace" font-size="10">NATIVE AOT</text>
    <text x="1045" y="260" text-anchor="middle" fill="#E0D1F3" font-family="Arial, sans-serif" font-size="14" font-weight="700">Native output</text>
  </g>
  <g fill="#B4F4FF"><circle cx="307" cy="153" r="4"/><circle cx="602" cy="153" r="4"/><circle cx="897" cy="153" r="4"/></g>
  <rect x="407" y="273" width="386" height="18" rx="9" fill="#171D34"/><text x="600" y="286" text-anchor="middle" fill="#94A8C7" font-family="monospace" font-size="9" letter-spacing="1.5">OFFLINE PACKAGES  ·  GROWING STANDARD LIBRARY</text>
</svg>
