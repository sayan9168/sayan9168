<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sayanox seed-to-gen3 compiler and native AOT pipeline</title>
  <desc id="desc">A six-stage isometric visualization: Sayanox source, seed compiler, gen1, gen2, gen3, and native x86-64 AOT output.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="0" x2="1150" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#08121F"/><stop offset="1" stop-color="#15132F"/></linearGradient>
    <linearGradient id="link" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#53E7E7"/><stop offset=".55" stop-color="#599BFF"/><stop offset="1" stop-color="#C47BFF"/></linearGradient>
    <linearGradient id="top" x1="48" y1="94" x2="177" y2="156" gradientUnits="userSpaceOnUse"><stop stop-color="#1B4B61"/><stop offset="1" stop-color="#2A3065"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" stroke="#A8BFFF" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="0" y="52" width="1200" height="190" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#bg)" stroke="#7C9AFF" stroke-opacity=".23" stroke-width="2"/><rect x="2" y="2" width="1196" height="356" rx="21" fill="url(#grid)"/>
  <text x="38" y="40" fill="#70E8FF" font-family="monospace" font-size="12" letter-spacing="3">SAYANOX  /  SEED-TO-SELF-HOSTING JOURNEY</text>
  <path d="M96 159H1105" stroke="url(#link)" stroke-opacity=".3" stroke-width="15" filter="url(#glow)"/><path d="M96 159H1105" stroke="url(#link)" stroke-width="2.4" stroke-dasharray="6 7"/>
  <!-- Stage 1: source -->
  <g transform="translate(102 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#38B6C8" opacity=".28" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="url(#top)" stroke="#62E5EE" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#A4F7FF" stroke-opacity=".47"/><text x="0" y="143" text-anchor="middle" fill="#ECFFFF" font-family="monospace" font-size="16" font-weight="700">.sa</text><text x="0" y="211" text-anchor="middle" fill="#C5D7E8" font-family="Arial,sans-serif" font-size="12" font-weight="700">SOURCE</text></g>
  <!-- Stage 2: seed -->
  <g transform="translate(301 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#348BC8" opacity=".27" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="#142D4A" stroke="#58B9FF" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#9BD9FF" stroke-opacity=".48"/><text x="0" y="143" text-anchor="middle" fill="#EAF7FF" font-family="monospace" font-size="14" font-weight="700">SEED</text><text x="0" y="211" text-anchor="middle" fill="#C5D7E8" font-family="Arial,sans-serif" font-size="12" font-weight="700">BOOTSTRAP</text></g>
  <!-- Stage 3: gen1 -->
  <g transform="translate(500 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#3979CF" opacity=".26" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="#172A53" stroke="#638FFF" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#AEC2FF" stroke-opacity=".48"/><text x="0" y="143" text-anchor="middle" fill="#F0F3FF" font-family="monospace" font-size="14" font-weight="700">GEN 1</text><text x="0" y="211" text-anchor="middle" fill="#C5D0E8" font-family="Arial,sans-serif" font-size="12" font-weight="700">COMPILER</text></g>
  <!-- Stage 4: gen2 -->
  <g transform="translate(699 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#555FCE" opacity=".26" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="#20264F" stroke="#898BFF" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#C4C2FF" stroke-opacity=".48"/><text x="0" y="143" text-anchor="middle" fill="#F4F0FF" font-family="monospace" font-size="14" font-weight="700">GEN 2</text><text x="0" y="211" text-anchor="middle" fill="#D3CDE9" font-family="Arial,sans-serif" font-size="12" font-weight="700">SELF-HOST</text></g>
  <!-- Stage 5: gen3 -->
  <g transform="translate(898 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#855ACD" opacity=".27" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="#2C2251" stroke="#B277FF" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#E0B5FF" stroke-opacity=".5"/><text x="0" y="143" text-anchor="middle" fill="#FFF0FF" font-family="monospace" font-size="14" font-weight="700">GEN 3</text><text x="0" y="211" text-anchor="middle" fill="#E1C6EB" font-family="Arial,sans-serif" font-size="12" font-weight="700">REPRODUCIBLE</text></g>
  <!-- Stage 6: native -->
  <g transform="translate(1097 0)"><ellipse cx="0" cy="225" rx="63" ry="12" fill="#AB59D5" opacity=".28" filter="url(#shadow)"/><path d="m0 76 61 26v67l-61 29-61-29v-67l61-26Z" fill="#35204D" stroke="#DD8CFF" stroke-width="1.7"/><path d="m0 95 44 19v45L0 180l-44-21v-45L0 95Z" stroke="#F1C1FF" stroke-opacity=".5"/><text x="0" y="141" text-anchor="middle" fill="#FFF3FF" font-family="monospace" font-size="12" font-weight="700">x86-64</text><text x="0" y="211" text-anchor="middle" fill="#E6C6F0" font-family="Arial,sans-serif" font-size="12" font-weight="700">NATIVE AOT</text></g>
  <g fill="#C5F8FF"><circle cx="201" cy="159" r="4"/><circle cx="400" cy="159" r="4"/><circle cx="599" cy="159" r="4"/><circle cx="798" cy="159" r="4"/><circle cx="997" cy="159" r="4"/></g>
  <rect x="359" y="278" width="482" height="35" rx="17.5" fill="#111B31" stroke="#5E8CD1" stroke-opacity=".4"/><text x="600" y="300" text-anchor="middle" fill="#AABBD5" font-family="monospace" font-size="10" letter-spacing="1.6">OFFLINE PACKAGES  ·  GROWING STANDARD LIBRARY  ·  NATIVE OUTPUT</text>
  <text x="600" y="340" text-anchor="middle" fill="#7186A7" font-family="monospace" font-size="9" letter-spacing="1.6">A CONCEPTUAL VIEW OF THE PROJECT'S BOOTSTRAP STAGES</text>
</svg>
