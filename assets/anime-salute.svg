  <text x="70" y="230" fill="#F0F6FF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing=".8">SALUTE TO</text>
  <text x="70" y="282" fill="#B8DFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing=".8">THE BUILDERS</text>
  <text x="74" y="335" fill="#9BAEC9" font-family="Arial, Helvetica, sans-serif" font-size="17">For the curious minds who keep</text>
  <text x="74" y="360" fill="#9BAEC9" font-family="Arial, Helvetica, sans-serif" font-size="17">learning, creating, and making</text>
  <text x="74" y="385" fill="#9BAEC9" font-family="Arial, Helvetica, sans-serif" font-size="17">the impossible feel inevitable.</text>
