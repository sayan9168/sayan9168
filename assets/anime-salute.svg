<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">An original anime-inspired shinobi salutes the viewer</title>
  <desc id="desc">A polished, dimensional anime-style illustration of an original blond-haired shinobi in orange and charcoal, giving a friendly salute beneath cyan and violet rim light. The character is not from an existing series.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="14" x2="1134" y2="669" gradientUnits="userSpaceOnUse"><stop stop-color="#070D19"/><stop offset=".53" stop-color="#0D1730"/><stop offset="1" stop-color="#211536"/></linearGradient>
    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientTransform="matrix(370 27 -37 286 875 306)" gradientUnits="userSpaceOnUse"><stop stop-color="#276AB4" stop-opacity=".47"/><stop offset=".63" stop-color="#7155BD" stop-opacity=".17"/><stop offset="1" stop-color="#7155BD" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="759" y1="84" x2="939" y2="269" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF3A5"/><stop offset=".35" stop-color="#FFC845"/><stop offset=".76" stop-color="#F39827"/><stop offset="1" stop-color="#B95D22"/></linearGradient>
    <linearGradient id="skin" x1="754" y1="159" x2="954" y2="359" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE6CA"/><stop offset=".42" stop-color="#EFB58F"/><stop offset=".78" stop-color="#C87965"/><stop offset="1" stop-color="#8B4B53"/></linearGradient>
    <linearGradient id="band" x1="769" y1="156" x2="940" y2="201" gradientUnits="userSpaceOnUse"><stop stop-color="#253650"/><stop offset=".5" stop-color="#B7C8D4"/><stop offset=".72" stop-color="#6E859A"/><stop offset="1" stop-color="#26364C"/></linearGradient>
    <linearGradient id="jacket" x1="719" y1="370" x2="1037" y2="676" gradientUnits="userSpaceOnUse"><stop stop-color="#FF8B37"/><stop offset=".42" stop-color="#E85F2E"/><stop offset="1" stop-color="#8E3440"/></linearGradient>
    <linearGradient id="darkCloth" x1="695" y1="403" x2="1015" y2="648" gradientUnits="userSpaceOnUse"><stop stop-color="#273650"/><stop offset=".5" stop-color="#131F35"/><stop offset="1" stop-color="#101326"/></linearGradient>
    <linearGradient id="metal" x1="807" y1="146" x2="887" y2="182" gradientUnits="userSpaceOnUse"><stop stop-color="#D6F7FF"/><stop offset=".42" stop-color="#758AA3"/><stop offset=".72" stop-color="#D7E6EE"/><stop offset="1" stop-color="#51647D"/></linearGradient>
    <linearGradient id="hand" x1="808" y1="193" x2="921" y2="315" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE7CE"/><stop offset=".62" stop-color="#E5A782"/><stop offset="1" stop-color="#B96762"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" stroke="#A7C5FF" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="625" y="29" width="566" height="622" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="651" y="65" width="514" height="614" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
