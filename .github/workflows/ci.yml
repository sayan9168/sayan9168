name: SAYANOX Identity OS CI
on:
  push:
    branches: [main, feature/sayanox-identity-os]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          for f in ['identity.json','projects.json']:
              with open(f, encoding='utf-8') as h: json.load(h)
          print('JSON validation passed')
          PY
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          echo 'Required files present'
